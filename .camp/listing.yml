name: filter_ruby
summary: 'A Moodle text filter that adds furigana (ruby) readings above Japanese kanji, with word lists each course can customise.'
description: |
  For teachers of Japanese and courses with Japanese reading material. Readings
  come from three sources, nearest first: inline markup typed by the author
  ({漢字|かんじ} or ｜漢字《かんじ》), word=reading lists set per site, category,
  course or activity, and four optional tier dictionaries (elementary to
  university level) derived from JMdict and KANJIDIC2. Display modes cover
  always, first occurrence only, on hover, or a per-user reader toggle button.
